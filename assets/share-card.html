<!doctype html>
<!-- Source for public/share.png, the 1200x630 link preview image. Render it with headless Chrome (see README). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@500;700&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid; grid-template-columns: 470px 1fr; gap: 64px; align-items: center;
      padding: 0 72px 0 80px; color: #f4ecdc; font-family: Inter, sans-serif;
      background: radial-gradient(ellipse at 22% 45%, #3d2e20, #13100d 70%);
    }
    .logo {
      width: 470px; height: 470px; border-radius: 34px; transform: rotate(-2.5deg);
      box-shadow: 0 0 0 8px #f4ecdc, 0 28px 50px #000c;
    }
    .kicker {
      display: inline-block; margin: 0 0 22px; padding: 7px 14px 8px; border-radius: 8px;
      background: #ffe07a; color: #221b14; font: 700 20px Inter, sans-serif; letter-spacing: 2px;
      text-transform: uppercase; transform: rotate(-1.5deg);
    }
    h1 { margin: 0; font: 400 78px/1.02 "Alfa Slab One", serif; }
    h1 span { color: #ec5a41; }
    p { margin: 26px 0 0; max-width: 480px; font: 500 28px/1.38 Inter, sans-serif; color: #d8cbb3; }
    b { color: #f4ecdc; }
  </style>
</head>
<body>
  <img class="logo" src="../public/logo.svg" alt="">
  <div>
    <span class="kicker">A $WIF game</span>
    <h1>Convince the <span>Flat Earther</span></h1>
    <p>Pay $WIF to argue with Earl. <b>Catch him contradicting himself</b> and the pot is yours.</p>
  </div>
</body>
</html>
