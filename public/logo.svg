<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Convince the Flat Earther</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#ec5a41"/>
      <stop offset=".65" stop-color="#d9442e"/>
      <stop offset="1" stop-color="#a8311f"/>
    </radialGradient>
    <pattern id="plaid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#c4543b"/>
      <rect y="7" width="20" height="6" fill="#5a120a" fill-opacity=".32"/>
      <rect x="7" width="6" height="20" fill="#5a120a" fill-opacity=".32"/>
      <rect y="2" width="20" height="1.2" fill="#ffe6c8" fill-opacity=".28"/>
      <rect x="2" width="1.2" height="20" fill="#ffe6c8" fill-opacity=".28"/>
    </pattern>
    <linearGradient id="brim" x1="0" x2="1">
      <stop offset="0" stop-color="#f3f5f8"/>
      <stop offset=".5" stop-color="#c3c9d1"/>
      <stop offset="1" stop-color="#8e97a2"/>
    </linearGradient>
    <!-- Die-cut sticker: a cream outline around Earl, with a soft shadow under it. -->
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="grown"/>
      <feFlood flood-color="#f4ecdc"/>
      <feComposite in2="grown" operator="in" result="outline"/>
      <feGaussianBlur in="grown" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dy="5" result="drop"/>
      <feFlood flood-color="#3a0d05" flood-opacity=".45"/>
      <feComposite in2="drop" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(40 28) scale(1.8)" filter="url(#sticker)">
    <path d="M28 280c2-48 30-66 64-72h56c34 6 62 24 64 72z" fill="url(#plaid)"/>
    <path d="M96 206l24 26-12-28zM144 206l-24 26 12-28z" fill="#f1e6cc"/>
    <rect x="104" y="184" width="32" height="30" rx="10" fill="#e2ad6c"/>
    <g transform="translate(0 -10)">
      <circle cx="164" cy="248" r="11" fill="#2f7fd6" stroke="#f1e6cc" stroke-width="3"/>
      <path d="M158 246c3-4 8-4 10 0s-3 6-6 5-7-2-4-5zM164 252c2-1 5 0 5 1s-3 2-5 1z" fill="#4cc38a"/>
    </g>
