    <path d="M92 172c8-12 22-10 28-4 6-6 20-8 28 4-8 4-18 5-28 0-10 5-20 4-28 0z" fill="#5e3519"/>
    <ellipse cx="121" cy="155" rx="8" ry="6" fill="#e3a465"/>
    <circle cx="98" cy="136" r="4.6" fill="#2b2118"/>
    <circle cx="142" cy="136" r="4.6" fill="#2b2118"/>
    <circle cx="99.6" cy="134.4" r="1.4" fill="#fff"/>
    <circle cx="143.6" cy="134.4" r="1.4" fill="#fff"/>
    <path d="M80 132H70M160 132h10" stroke="#2b2118" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="97" cy="135" r="17" fill="#ffffff" fill-opacity=".16" stroke="#2b2118" stroke-width="4"/>
    <circle cx="143" cy="135" r="17" fill="#ffffff" fill-opacity=".16" stroke="#2b2118" stroke-width="4"/>
